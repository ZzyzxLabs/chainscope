# Dependency updates.
#
# Actions are pinned by tag rather than SHA in ci.yml, so an upstream tag move
# is a real supply-chain path into CI. Weekly checks keep that window short.
#
# Python dependencies are grouped: this project pins loose lower bounds, so
# individual bumps are mostly noise, and a single grouped PR gets reviewed
# properly where twelve separate ones get rubber-stamped.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling:
        patterns: ["pytest*", "mypy", "ruff", "hypothesis"]
      runtime:
        patterns: ["httpx", "platformdirs", "eth-*", "base58*", "bech32", "rich"]
