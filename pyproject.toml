[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chainscope"
version = "0.1.0"
description = "Open-source blockchain forensics toolkit — everything you can do with public data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "chainscope contributors" }]
keywords = [
    "blockchain", "forensics", "bitcoin", "ethereum", "aml",
    "tracing", "investigation", "osint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# Core stays deliberately thin. Chain- and provider-specific deps are extras,
# so `pip install chainscope` never drags in a Solana SDK you will not use.
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# eth-utils delegates keccak to eth-hash, which ships no backend of its own.
# Declaring eth-utils alone installs cleanly and then fails at first hash --
# so the backend is pinned here explicitly.
evm = ["eth-utils>=5.0", "eth-abi>=5.0", "eth-hash[pycryptodome]>=0.7"]
bitcoin = ["base58>=2.1", "bech32>=1.2"]
solana = ["base58>=2.1"]
tron = ["base58>=2.1"]
# Sui needs nothing extra: addresses are hex and the RPC is plain JSON.
sui = []
report = ["rich>=13.0"]
analytics = ["duckdb>=1.0"]
# The server imports mcp.server.mcpserver, which is a v2 API. `>=1.2` admits
# a 1.x install that satisfies the constraint and then fails at first import
# with a missing-module error that reads like a broken package.
agent = ["mcp>=2.0"]
all = ["chainscope[evm,bitcoin,solana,tron,sui,report,analytics,agent]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/ZzyzxLabs/chainscope"
Documentation = "https://github.com/ZzyzxLabs/chainscope/tree/main/docs"
Issues = "https://github.com/ZzyzxLabs/chainscope/issues"

[project.scripts]
chainscope = "chainscope.cli.main:main"
chainscope-mcp = "chainscope.agent.server:main"
chainscope-serve = "chainscope.server.local:main"

# ---------------------------------------------------------------- plugin points
# Third-party packages register here. Declaring the same entry-point group is
# the ONLY thing needed to extend chainscope — no core changes, no registration
# calls. See docs/extending.md.

[project.entry-points."chainscope.providers"]
jsonrpc = "chainscope.providers.jsonrpc:JsonRpcProvider"
etherscan = "chainscope.providers.etherscan:EtherscanProvider"
blockscout = "chainscope.providers.blockscout:BlockscoutProvider"
sui = "chainscope.providers.sui:SuiProvider"

[project.entry-points."chainscope.chains"]
evm = "chainscope.chains.evm:EvmAdapter"
bitcoin = "chainscope.chains.bitcoin:BitcoinAdapter"
solana = "chainscope.chains.solana:SolanaAdapter"
tron = "chainscope.chains.tron:TronAdapter"
sui = "chainscope.chains.sui:SuiAdapter"

[project.entry-points."chainscope.analyzers"]
consolidation = "chainscope.analysis.consolidation:ConsolidationAnalyzer"
cross_chain = "chainscope.analysis.xchain:CrossChainMatcher"
peel_chain = "chainscope.analysis.peel:PeelChainAnalyzer"
co_spend_cluster = "chainscope.analysis.cluster:CoSpendClusterAnalyzer"
common_funder = "chainscope.analysis.funding:CommonFunderAnalyzer"
temporal = "chainscope.analysis.temporal:TemporalAnalyzer"
probing = "chainscope.analysis.probing:ProbingAnalyzer"

[project.entry-points."chainscope.stores"]
sqlite = "chainscope.store.sqlite:SqliteStore"

[project.entry-points."chainscope.pricing"]
binance = "chainscope.pricing.binance:BinanceKlines"

[project.entry-points."chainscope.attribution_sources"]
ofac = "chainscope.attribution.sources.ofac:OfacSource"
explorer_nametags = "chainscope.attribution.sources.etherscan_dump:ExplorerDumpSource"
local = "chainscope.attribution.sources.local:LocalSource"

[tool.hatch.build.targets.wheel]
packages = ["src/chainscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: hits real APIs; skipped by default (CI must stay offline)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/chainscope"]
