[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chainscope"
version = "0.1.0"
description = "Open-source blockchain forensics toolkit — everything you can do with public data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "chainscope contributors" }]
keywords = [
    "blockchain", "forensics", "bitcoin", "ethereum", "aml",
    "tracing", "investigation", "osint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# Core stays deliberately thin. Chain- and provider-specific deps are extras,
# so `pip install chainscope` never drags in a Solana SDK you will not use.
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# eth-utils delegates keccak to eth-hash, which ships no backend of its own.
# Declaring eth-utils alone installs cleanly and then fails at first hash --
# so the backend is pinned here explicitly.
evm = ["eth-utils>=5.0", "eth-abi>=5.0", "eth-hash[pycryptodome]>=0.7"]
bitcoin = ["base58>=2.1", "bech32>=1.2"]
solana = ["base58>=2.1"]
# TagPacks are YAML. Optional, because the corpus is a separate 500k-address
# download and somebody who never fetches it should not carry the parser.
tagpacks = ["PyYAML>=6.0"]
tron = ["base58>=2.1"]
# Sui needs nothing extra: addresses are hex and the RPC is plain JSON.
sui = []
report = ["rich>=13.0"]
analytics = ["duckdb>=1.0"]
# The server imports mcp.server.mcpserver, which is a v2 API. `>=1.2` admits
# a 1.x install that satisfies the constraint and then fails at first import
# with a missing-module error that reads like a broken package.
agent = ["mcp>=2.0"]
all = ["chainscope[evm,bitcoin,solana,tron,sui,report,analytics,agent]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    # Stubs for the optional extras that `all` pulls in, so `mypy` sees the
    # same thing in CI as on a machine where somebody happened to install them
    # once. Without this every push failed on
    # `Library stubs not installed for "yaml"` --- an error nobody could
    # reproduce locally, because a local venv that has ever installed the stub
    # keeps it.
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/ZzyzxLabs/chainscope"
Documentation = "https://github.com/ZzyzxLabs/chainscope/tree/main/docs"
Issues = "https://github.com/ZzyzxLabs/chainscope/issues"

[project.scripts]
chainscope = "chainscope.cli.main:main"
chainscope-mcp = "chainscope.agent.server:main"
chainscope-serve = "chainscope.server.local:main"

# ---------------------------------------------------------------- plugin points
# Third-party packages register here. Declaring the same entry-point group is
# the ONLY thing needed to extend chainscope — no core changes, no registration
# calls. See docs/extending.md.

[project.entry-points."chainscope.providers"]
jsonrpc = "chainscope.providers.jsonrpc:JsonRpcProvider"
etherscan = "chainscope.providers.etherscan:EtherscanProvider"
blockscout = "chainscope.providers.blockscout:BlockscoutProvider"
sui = "chainscope.providers.sui:SuiProvider"

[project.entry-points."chainscope.chains"]
evm = "chainscope.chains.evm:EvmAdapter"
bitcoin = "chainscope.chains.bitcoin:BitcoinAdapter"
solana = "chainscope.chains.solana:SolanaAdapter"
tron = "chainscope.chains.tron:TronAdapter"
sui = "chainscope.chains.sui:SuiAdapter"

[project.entry-points."chainscope.analyzers"]
consolidation = "chainscope.analysis.consolidation:ConsolidationAnalyzer"
cross_chain = "chainscope.analysis.xchain:CrossChainMatcher"
peel_chain = "chainscope.analysis.peel:PeelChainAnalyzer"
co_spend_cluster = "chainscope.analysis.cluster:CoSpendClusterAnalyzer"
common_funder = "chainscope.analysis.funding:CommonFunderAnalyzer"
linked_holders = "chainscope.analysis.holders:HoldersAnalyzer"
temporal = "chainscope.analysis.temporal:TemporalAnalyzer"
probing = "chainscope.analysis.probing:ProbingAnalyzer"
mixer = "chainscope.analysis.mixer:MixerAnalyzer"
taint = "chainscope.analysis.taint:TaintAnalyzer"
impersonation = "chainscope.analysis.impersonation:ImpersonationAnalyzer"
poisoning = "chainscope.analysis.poisoning:PoisoningAnalyzer"
route = "chainscope.analysis.route:RouteAnalyzer"
contributors = "chainscope.analysis.contributors:ContributorsAnalyzer"

[project.entry-points."chainscope.stores"]
sqlite = "chainscope.store.sqlite:SqliteStore"

[project.entry-points."chainscope.pricing"]
binance = "chainscope.pricing.binance:BinanceKlines"

[project.entry-points."chainscope.attribution_sources"]
ofac = "chainscope.attribution.sources.ofac:OfacSource"
explorer_nametags = "chainscope.attribution.sources.etherscan_dump:ExplorerDumpSource"
local = "chainscope.attribution.sources.local:LocalSource"
darklist = "chainscope.attribution.sources.darklist:DarklistSource"
eth_labels = "chainscope.attribution.sources.ethlabels:EthLabelsSource"
contracts_list = "chainscope.attribution.sources.contracts_list:ContractsListSource"

[tool.hatch.build.targets.wheel]
packages = ["src/chainscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: hits real APIs; skipped by default (CI must stay offline)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# RUF001/2/3 flag characters that resemble ASCII --- the same UTS #39 property
# `chainscope.core.confusable` is built on, and a good rule everywhere else in
# this codebase.
#
# One file is exempt wholesale, because the confusable characters are its
# entire content: `confusable.py` IS the mapping table, and seventy `noqa`
# markers on seventy table entries would be noise around the one file where
# nobody could mistake the intent.
#
# `analysis/impersonation.py` carries RUF002 only and
# `tests/unit/test_impersonation.py` carries RUF001 and RUF002 --- the test
# file's fixtures are forged symbols in code as well as in its docstring. The
# reason in both cases is a language limitation rather than a preference: their
# confusables sit inside *docstrings*, the worked examples that explain the
# attack, and Python has nowhere to put a `noqa` inside a string literal.
#
# Everywhere a marker can actually attach --- the agent tool description, the
# poisoning fixture --- it is per line, so an *accidental* confusable in those
# files is still caught. That is the whole value of the rule, and a file-wide
# ignore throws it away for the sake of one line.
[tool.ruff.lint.per-file-ignores]
"src/chainscope/core/confusable.py" = ["RUF001", "RUF002", "RUF003"]
"src/chainscope/analysis/impersonation.py" = ["RUF002"]
"tests/unit/test_impersonation.py" = ["RUF001", "RUF002"]
# Same reason: its fixtures are three real counterfeit tickers from the LpdFi
# case, in the docstring that explains them and in the table that tests them.
"tests/unit/test_invisible_characters_in_a_ticker.py" = ["RUF001", "RUF002"]
# Its fixture is a counterfeit ticker from the same case, in code.
"tests/unit/test_the_trail_folds_noise_without_deleting_it.py" = ["RUF001"]


[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/chainscope"]
